<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Merged Feed</title>
  <meta name="color-scheme" content="light dark" />
  <style>
    :root{--bg:#0b0c10;--panel:rgba(255,255,255,0.06);--panel2:rgba(255,255,255,0.10);--text:rgba(255,255,255,0.92);--muted:rgba(255,255,255,0.65);--border:rgba(255,255,255,0.12);--accent:#8bd3ff;--shadow:0 10px 30px rgba(0,0,0,0.35);--radius:16px;--maxw:980px;}
    @media (prefers-color-scheme: light){:root{--bg:#f6f7fb;--panel:rgba(0,0,0,0.03);--panel2:rgba(0,0,0,0.05);--text:rgba(0,0,0,0.86);--muted:rgba(0,0,0,0.55);--border:rgba(0,0,0,0.12);--accent:#0066ff;--shadow:0 10px 30px rgba(0,0,0,0.10);}}
    *{box-sizing:border-box;} body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
    a{color:var(--accent);text-decoration:none;} a:hover{text-decoration:underline;}
    .wrap{max-width:var(--maxw);margin:28px auto;padding:0 16px 40px;}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px;border:1px solid var(--border);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:var(--radius);box-shadow:var(--shadow);}
    h1{margin:0;font-size:28px;}
    .sub{color:var(--muted);font-size:14px;margin-top:6px;}
    .controls{display:flex;flex-direction:column;gap:10px;min-width:320px;width:420px;max-width:100%;}
    input,select,button{border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);border-radius:12px;padding:10px 12px;font-size:13px;}
    input{width:100%;outline:none;} input::placeholder{color:var(--muted);}
    .row{display:flex;gap:10px;} .row>*{flex:1;}
    .metaLine{margin-top:10px;color:var(--muted);font-size:13px;}
    .list{margin-top:16px;display:flex;flex-direction:column;gap:12px;}
    .card{border:1px solid var(--border);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
    .cardInner{padding:16px 16px 14px;}
    .cardTitle{font-size:18px;font-weight:750;margin:0 0 6px;line-height:1.2;}
    .cardTitle a{color:var(--text);}
    .cardMeta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;}
    .tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,0.04);font-size:12px;color:var(--muted);}
    .preview{margin-top:12px;line-height:1.45;font-size:14px;}
    .actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center;}
    .btnLink{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);text-decoration:none;font-size:13px;}
    .btnLink:hover{background:rgba(255,255,255,0.08);text-decoration:none;}
    .empty{padding:18px;border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted);text-align:center;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Merged Feed</h1>
        <div class="sub">
          Merged RSS: <a href="./merged.xml">./merged.xml</a> |
          Split feeds: <a href="./feeds/">./feeds/</a>
        </div>
        <div class="metaLine" id="status">Loading…</div>
      </div>
      <div class="controls">
        <input id="q" type="search" placeholder="Search titles and previews…" />
        <div class="row">
          <select id="mode">
            <option value="preview">Preview mode</option>
            <option value="full">Full mode</option>
          </select>
          <button id="clear" type="button">Clear</button>
        </div>
      </div>
    </div>

    <div class="list" id="list"></div>
  </div>

<script>
  function firstTagText(el, tag) {
    const n = el.getElementsByTagName(tag)[0];
    return n ? (n.textContent || "").trim() : "";
  }
  function stripHtml(html) {
    const tmp = document.createElement("div");
    tmp.innerHTML = html || "";
    return (tmp.textContent || tmp.innerText || "").trim();
  }
  function clampText(s, maxLen) {
    if (!s) return "";
    if (s.length <= maxLen) return s;
    return s.slice(0, maxLen).trimEnd() + "…";
  }
  function hostnameFromUrl(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); }
    catch { return "unknown"; }
  }
  function niceDate(pubDate) {
    if (!pubDate) return "";
    const d = new Date(pubDate);
    if (isNaN(d.getTime())) return pubDate;
    return d.toLocaleString();
  }

  async function loadFeed() {
    const res = await fetch("./merged.xml", { cache: "no-store" });
    if (!res.ok) throw new Error("Failed to fetch merged.xml: " + res.status);
    const xmlText = await res.text();
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    return Array.from(doc.getElementsByTagName("item")).map(item => {
      const title = firstTagText(item, "title") || "(no title)";
      const link = firstTagText(item, "link") || "";
      const pubDate = firstTagText(item, "pubDate") || "";
      const descHtml = firstTagText(item, "description") || "";
      const host = hostnameFromUrl(link);
      return {
        title, link, host,
        pubNice: niceDate(pubDate),
        descHtml,
        preview: clampText(stripHtml(descHtml), 280)
      };
    });
  }

  function render(items, mode, query) {
    const list = document.getElementById("list");
    const q = (query || "").toLowerCase().trim();
    const filtered = !q ? items : items.filter(it =>
      it.title.toLowerCase().includes(q) ||
      it.preview.toLowerCase().includes(q) ||
      it.host.toLowerCase().includes(q)
    );

    document.getElementById("status").textContent = `Loaded ${items.length} items. Showing ${filtered.length}.`;
    list.innerHTML = "";

    if (filtered.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No results.";
      list.appendChild(empty);
      return;
    }

    for (const it of filtered) {
      const card = document.createElement("div");
      card.className = "card";
      const inner = document.createElement("div");
      inner.className = "cardInner";

      const h = document.createElement("h2");
      h.className = "cardTitle";
      const a = document.createElement("a");
      a.href = it.link || "#";
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = it.title;
      h.appendChild(a);

      const meta = document.createElement("div");
      meta.className = "cardMeta";
      const date = document.createElement("span");
      date.textContent = it.pubNice || "";
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = it.host;
      meta.appendChild(date);
      meta.appendChild(tag);

      const body = document.createElement("div");
      body.className = "preview";
      body.innerHTML = (mode === "full") ? (it.descHtml || "") : (it.preview || "");

      const actions = document.createElement("div");
      actions.className = "actions";
      const open = document.createElement("a");
      open.className = "btnLink";
      open.href = it.link || "#";
      open.target = "_blank";
      open.rel = "noopener noreferrer";
      open.textContent = "Open article";
      actions.appendChild(open);

      inner.appendChild(h);
      inner.appendChild(meta);
      inner.appendChild(body);
      inner.appendChild(actions);
      card.appendChild(inner);
      list.appendChild(card);
    }
  }

  (async function init(){
    const qInput = document.getElementById("q");
    const modeSel = document.getElementById("mode");
    const clearBtn = document.getElementById("clear");

    let items = [];
    try { items = await loadFeed(); }
    catch (e) {
      document.getElementById("status").textContent = e.message;
      return;
    }

    const rerender = () => render(items, modeSel.value, qInput.value);
    qInput.addEventListener("input", rerender);
    modeSel.addEventListener("change", rerender);
    clearBtn.addEventListener("click", () => { qInput.value = ""; modeSel.value = "preview"; rerender(); });
    rerender();
  })();
</script>
</body>
</html>
